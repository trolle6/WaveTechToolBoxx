<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Santa History (local sim)</title>
  <style>
    :root {
      --bg: #2b2d31;
      --row: #313338;
      --row-hover: #3a3c42;
      --text: #dbdee1;
      --muted: #949ba4;
      --accent: #5865f2;
      --sim: #faa61a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
    .list { display: flex; flex-direction: column; gap: 2px; }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; background: var(--row); border-radius: 6px;
      cursor: pointer; border: none; width: 100%; text-align: left; color: inherit;
    }
    .row:hover, .row.active { background: var(--row-hover); }
    .icon {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      background: #ed4245; display: grid; place-items: center; font-size: 16px;
    }
    .title { flex: 1; font-weight: 500; }
    .count { color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .sim-badge { color: var(--sim); font-size: 0.75rem; margin-left: 6px; }
    .detail {
      margin-top: 16px; padding: 14px; background: var(--row); border-radius: 8px;
      display: none;
    }
    .detail.open { display: block; }
    .detail h2 { margin: 0 0 8px; font-size: 1rem; }
    .detail p { margin: 0 0 10px; color: var(--muted); font-size: 0.9rem; }
    .people { max-height: 280px; overflow: auto; font-size: 0.88rem; }
    .people div { padding: 3px 0; border-bottom: 1px solid #3f4147; }
    .err { color: #f04747; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Secret Santa Archive</h1>
    <p class="sub">Local simulation from <code>cogs/archive/*.json</code> — not Discord, not a bot command.</p>
    <div id="list" class="list"></div>
    <div id="detail" class="detail"></div>
  </div>
  <script>
    const listEl = document.getElementById('list');
    const detailEl = document.getElementById('detail');
    let activeYear = null;

    function renderList(years) {
      listEl.innerHTML = '';
      years.forEach((y) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'row';
        btn.dataset.year = y.year;
        btn.innerHTML = `
          <span class="icon">🎅</span>
          <span class="title">Secret Santa ${y.year}${y.simulated ? '<span class="sim-badge">sim</span>' : ''}</span>
          <span class="count">${y.participant_count} <span aria-hidden="true">👤</span></span>
        `;
        btn.addEventListener('click', () => showYear(y.year, btn));
        listEl.appendChild(btn);
      });
    }

    async function showYear(year, btn) {
      document.querySelectorAll('.row').forEach((r) => r.classList.remove('active'));
      btn.classList.add('active');
      activeYear = year;
      detailEl.classList.add('open');
      detailEl.innerHTML = '<p>Loading…</p>';
      const res = await fetch('/api/year?year=' + year);
      const data = await res.json();
      if (!res.ok) {
        detailEl.innerHTML = '<p class="err">Failed to load year.</p>';
        return;
      }
      const names = Object.entries(data.participants || {})
        .sort((a, b) => a[1].localeCompare(b[1], undefined, { sensitivity: 'base' }));
      const pairs = Object.entries(data.assignments || {});
      let html = `<h2>Secret Santa ${data.year}</h2>`;
      html += `<p>${data.participant_count} participants · ${data.gift_count} gifts recorded</p>`;
      if (data.simulated) {
        html += `<p><strong>Simulated row:</strong> ${data.note || 'Everyone ever archived, merged for testing.'}</p>`;
      }
      if (pairs.length) {
        html += '<p><strong>Assignments</strong></p><div class="people">';
        pairs.slice(0, 40).forEach(([g, r]) => {
          const gn = data.participants[g] || g;
          const rn = data.participants[r] || r;
          const gift = (data.gifts[g] || {}).gift;
          html += `<div>${gn} → ${rn}${gift ? ' · ' + gift : ''}</div>`;
        });
        if (pairs.length > 40) html += `<div>…and ${pairs.length - 40} more</div>`;
        html += '</div>';
      } else if (names.length) {
        html += '<p><strong>All archived participants (sim merge)</strong></p><div class="people">';
        names.forEach(([id, name]) => { html += `<div>${name}</div>`; });
        html += '</div>';
      }
      detailEl.innerHTML = html;
    }

    fetch('/api/history')
      .then((r) => r.json())
      .then((data) => renderList(data.years || []))
      .catch(() => { listEl.innerHTML = '<p class="err">Could not load history. Is the server running?</p>'; });
  </script>
</body>
</html>
