<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTS Dev Lab</title>
  <style>
    :root { font-family: system-ui, sans-serif; background: #1a1b1e; color: #e4e4e7; }
    body { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    label { display: block; margin-top: 1rem; font-size: 0.85rem; color: #a1a1aa; }
    textarea, select, button { width: 100%; box-sizing: border-box; margin-top: 0.35rem; }
    textarea { min-height: 120px; padding: 0.6rem; background: #27272a; border: 1px solid #3f3f46; color: inherit; border-radius: 6px; }
    select, button { padding: 0.5rem; background: #27272a; border: 1px solid #3f3f46; color: inherit; border-radius: 6px; }
    button { cursor: pointer; background: #3b82f6; border-color: #2563eb; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 0.75rem; font-size: 0.85rem; color: #a1a1aa; min-height: 1.2em; }
    #console { margin-top: 1.5rem; background: #0f0f10; border: 1px solid #3f3f46; border-radius: 6px; padding: 0.75rem; font-family: ui-monospace, monospace; font-size: 0.75rem; max-height: 280px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
    audio { width: 100%; margin-top: 1rem; }
    .meta { color: #71717a; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>TTS Dev Lab</h1>
  <p class="meta">Local only — <code>http://127.0.0.1:8765</code>. API key stays on the server.</p>

  <label for="text">Text</label>
  <textarea id="text" placeholder="Type something to speak…"></textarea>

  <label for="voice">Voice</label>
  <select id="voice"></select>

  <button type="button" id="generate">Generate &amp; play</button>
  <p id="status"></p>
  <audio id="player" controls></audio>

  <h2 style="font-size:1rem;margin-top:2rem;">Console</h2>
  <div id="console"></div>

  <script>
    const textEl = document.getElementById('text');
    const voiceEl = document.getElementById('voice');
    const btn = document.getElementById('generate');
    const statusEl = document.getElementById('status');
    const player = document.getElementById('player');
    const consoleEl = document.getElementById('console');

    function appendLog(line) {
      consoleEl.textContent += line + '\n';
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    async function loadVoices() {
      const r = await fetch('/api/voices');
      const data = await r.json();
      voiceEl.innerHTML = data.voices.map(v =>
        `<option value="${v}"${v === data.default ? ' selected' : ''}>${v}</option>`
      ).join('');
    }

    async function loadHealth() {
      const r = await fetch('/api/health');
      const data = await r.json();
      if (!data.openai_configured) {
        statusEl.textContent = 'Warning: OPENAI_API_KEY not set in config.env';
        statusEl.style.color = '#f87171';
      }
    }

    btn.addEventListener('click', async () => {
      const text = textEl.value.trim();
      if (!text) {
        statusEl.textContent = 'Enter some text first.';
        return;
      }
      btn.disabled = true;
      statusEl.textContent = 'Generating…';
      statusEl.style.color = '#a1a1aa';
      try {
        const t0 = performance.now();
        const r = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voice: voiceEl.value }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          statusEl.textContent = err.error || `HTTP ${r.status}`;
          statusEl.style.color = '#f87171';
          return;
        }
        const blob = await r.blob();
        const ms = Math.round(performance.now() - t0);
        const cache = r.headers.get('X-TTS-Cache-Hit') === '1';
        const apiMs = r.headers.get('X-TTS-Api-Ms') || '—';
        const bytes = r.headers.get('X-TTS-Bytes') || blob.size;
        statusEl.textContent = `OK — ${bytes} bytes, total ${ms} ms, API ${apiMs} ms${cache ? ', cache hit' : ''}`;
        statusEl.style.color = '#4ade80';
        player.src = URL.createObjectURL(blob);
        await player.play().catch(() => {});
      } catch (e) {
        statusEl.textContent = 'Request failed: ' + e.message;
        statusEl.style.color = '#f87171';
      } finally {
        btn.disabled = false;
      }
    });

    fetch('/api/logs').then(r => r.json()).then(d => {
      (d.lines || []).forEach(appendLog);
    });

    const es = new EventSource('/api/logs/stream');
    es.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.line) appendLog(data.line);
      } catch (_) {}
    };
    es.onerror = () => { /* reconnect handled by browser */ };

    loadVoices();
    loadHealth();
  </script>
</body>
</html>
